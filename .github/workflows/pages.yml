name: Community Goal site

# Builds the Community Goal guide (static JSON API + interactive site) and
# publishes it to GitHub Pages. Pull requests build without deploying, so a
# broken reference in the data fails review rather than production.

on:
  push:
    branches: [main]
    paths:
      - "community-goal/**"
      - "tests/test_community_goal.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "community-goal/**"
      - "tests/test_community_goal.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data and build tests
        run: python3 tests/test_community_goal.py

      - name: Resolve the public base URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the API and site
        run: |
          python3 community-goal/build.py \
            --dist community-goal/dist \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: community-goal/dist

  deploy:
    # Only main publishes; a pull request stops after proving the build works.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
