name: Community Goal site

# Builds the Community Goal guide (static JSON API + interactive site) and
# publishes it to GitHub Pages. Pull requests build without deploying, so a
# broken reference in the data fails review rather than production.

on:
  push:
    branches: [main]
    paths:
      - "community-goal/**"
      - "tests/test_community_goal.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "community-goal/**"
      - "tests/test_community_goal.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the resolve step below turns Pages on the first time it
      # runs, so publishing needs no click in repository settings.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data and build tests
        run: python3 tests/test_community_goal.py

      - name: Resolve the public base URL
        id: pages
        # enablement turns Pages on if it is off, so the first deploy does not
        # depend on someone finding a settings page.
        #
        # continue-on-error because a pull request must not fail over a
        # repository setting: PR builds prove the data is sound and deploy
        # nothing, so the fallback URL below is good enough for them.
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Pick the base URL
        id: base
        run: |
          url="${{ steps.pages.outputs.base_url }}"
          if [ -z "$url" ]; then
            # Pages could not be resolved (usually: not enabled yet, on a PR
            # build). Fall back to the address Pages will use for this
            # repository so generated links are still right.
            owner=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
            url="https://${owner}.github.io/${{ github.event.repository.name }}"
            echo "Pages not resolved; falling back to $url"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build the API and site
        run: |
          python3 community-goal/build.py \
            --dist community-goal/dist \
            --base-url "${{ steps.base.outputs.url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: community-goal/dist

  deploy:
    # Only main publishes; a pull request stops after proving the build works.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
